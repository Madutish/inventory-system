<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Inventory System</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 950px; margin: 20px auto; background: #f4f7f9; padding: 15px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        
        /* Input Styling */
        input { padding: 12px; margin: 5px 0 15px 0; width: 100%; box-sizing: border-box; border: 2px solid #bdc1c6; border-radius: 6px; font-size: 15px; }
        input:focus { border-color: #1a73e8; outline: none; background: #f8fbff; }
        label { font-weight: bold; color: #444; font-size: 13px; }
        
        /* Tabs */
        .tabs { display: flex; margin-bottom: 25px; gap: 10px; border-bottom: 2px solid #ddd; }
        .tab { padding: 12px 20px; cursor: pointer; color: #5f6368; font-weight: 500; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .tab:hover { background: #f1f3f4; }
        .tab.active { color: #1a73e8; border-bottom: 3px solid #1a73e8; font-weight: bold; }
        
        /* Layout & Buttons */
        .content-section { display: none; animation: fadeIn 0.3s; }
        .content-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        button { background: #1a73e8; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button:hover { opacity: 0.9; }
        
        .btn-issue { background: #d93025; } /* Red for Issue */
        .btn-excel { background: #188038; } /* Green for Excel */
        .btn-stock { background: #007bff; } /* Blue for Current Stock */
        .btn-history { background: #5f6368; } /* Grey for History */
        .btn-clear { background: #e0e0e0; color: #333; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        
        .result-box { border: 2px solid #1a73e8; padding: 20px; background: #f8fbff; margin-top: 20px; border-radius: 8px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { border: 1px solid #dadce0; padding: 10px; text-align: left; }
        th { background: #f1f3f4; color: #333; }
        tr:nth-child(even) { background-color: #fafafa; }
        
        /* Low Stock Alert in Table */
        .low-stock { color: #d93025; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color:#1a73e8;">Dept. Inventory System</h2>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('issue-tab', event)">
            <span class="material-icons">outbound</span> ISSUE ITEM
        </div>
        <div class="tab" onclick="switchTab('receive-tab', event)">
            <span class="material-icons">add_box</span> ADD STOCK
        </div>
        <div class="tab" onclick="switchTab('report-tab', event)">
            <span class="material-icons">analytics</span> REPORTS
        </div>
    </div>

    <div id="issue-tab" class="content-section active">
        <label>Scan or Enter Part Number:</label>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="searchPartNo" placeholder="Type Part No here..." onkeypress="handleEnter(event)">
            <button style="width: 120px;" onclick="searchItem()"><span class="material-icons">search</span> FIND</button>
        </div>

        <div id="searchResult" class="result-box" style="display:none;">
            <div class="grid-2">
                <div>
                    <small>Description</small><br>
                    <strong id="resDesc" style="font-size:1.1em;"></strong><br>
                    <small>Model</small><br>
                    <span id="resModel"></span>
                </div>
                <div style="text-align:right;">
                    <small>Current Stock</small><br>
                    <span id="resStock" style="font-size:28px; color:green; font-weight:bold;"></span>
                </div>
            </div>
            <hr style="border:0; border-top:1px solid #cce0ff; margin: 15px 0;">
            
            <div class="grid-3">
                <div><label>MR No:</label><input type="text" id="issueMR" class="issue-input" placeholder="Req. No"></div>
                <div><label>Emp No:</label><input type="text" id="issueEmp" class="issue-input" placeholder="E001"></div>
                <div><label>Machine:</label><input type="text" id="issueMachine" class="issue-input" placeholder="M-01"></div>
            </div>
            <div class="grid-2">
                <div><label>Department:</label><input type="text" id="issueDept" class="issue-input" placeholder="Sewing/Cutting"></div>
                <div><label>Qty:</label><input type="number" id="issueQty" class="issue-input" value="1"></div>
            </div>
            
            <button class="btn-issue" onclick="issueItem()">
                <span class="material-icons">send</span> CONFIRM ISSUE
            </button>
            <button class="btn-clear" onclick="resetIssueTab()">CANCEL</button>
        </div>
    </div>

    <div id="receive-tab" class="content-section">
        <div style="background:#fafafa; border:2px dashed #ccc; padding:15px; border-radius:8px; margin-bottom:20px; text-align:center;">
            <h3><span class="material-icons" style="vertical-align:middle;">upload_file</span> Bulk Import</h3>
            <input type="file" id="excelFile" accept=".xlsx, .xls">
            <button class="btn-excel" onclick="importFromExcel()">UPLOAD EXCEL</button>
            <small>Columns: PartNo, Model, Description, Quantity</small>
        </div>

        <h3>Manual Entry</h3>
        <label>Part Number:</label><input type="text" id="newPartNo">
        <div class="grid-2">
            <div><label>Model:</label><input type="text" id="newModel"></div>
            <div><label>Description:</label><input type="text" id="newDesc"></div>
        </div>
        <label>Quantity:</label><input type="number" id="newQty" value="1">
        <button onclick="receiveItem()"><span class="material-icons">save</span> SAVE STOCK</button>
    </div>

    <div id="report-tab" class="content-section">
        <div class="grid-2">
            <div style="border-right:1px solid #ddd; padding-right:10px;">
                <h4 style="margin-top:0;">History Report</h4>
                <div class="grid-2">
                    <div><label>From:</label><input type="date" id="startDate"></div>
                    <div><label>To:</label><input type="date" id="endDate"></div>
                </div>
                <button class="btn-history" onclick="loadTransactionReport()">
                    <span class="material-icons">history</span> VIEW HISTORY
                </button>
            </div>

            <div style="padding-left:10px;">
                <h4 style="margin-top:0;">Stock Status</h4>
                <p style="font-size:0.9em; color:#666;">View all items currently sitting in the warehouse.</p>
                <button class="btn-stock" onclick="loadCurrentStockReport()">
                    <span class="material-icons">inventory_2</span> VIEW CURRENT STOCK
                </button>
            </div>
        </div>

        <hr>
        <button class="btn-excel" onclick="exportToExcel()">
            <span class="material-icons">file_download</span> DOWNLOAD REPORT AS EXCEL
        </button>

        <h3 id="reportTitle">Report Output</h3>
        <div style="overflow-x:auto;">
            <table id="reportTable">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, addDoc, getDocs, query, where, Timestamp, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ---------------------------------------------------------
    // !!! PASTE YOUR FIREBASE CONFIG HERE !!!
    // ---------------------------------------------------------
    const firebaseConfig = {
apiKey: "AIzaSyDD-j_7VC20v4mNFmfdpEGk0yIErDF8Pv8",
authDomain: "inventory-system-5356c.firebaseapp.com",
projectId: "inventory-system-5356c",
storageBucket: "inventory-system-5356c.firebasestorage.app",
messagingSenderId: "691647241868",
appId: "1:691647241868:web:3ac4c43e1a7d11b71ba5a9",
measurementId: "G-D4VWJD23ND"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- 1. SEARCH & UI ---
    window.handleEnter = (e) => { if(e.key === 'Enter') searchItem(); }
    
    window.searchItem = async () => {
        const pNo = document.getElementById('searchPartNo').value.trim().toUpperCase();
        if(!pNo) return;

        const snap = await getDoc(doc(db, "inventory", pNo));
        if(snap.exists()){
            const data = snap.data();
            document.getElementById('searchResult').style.display = "block";
            document.getElementById('resDesc').innerText = data.description || "-";
            document.getElementById('resModel').innerText = data.model || "-";
            document.getElementById('resStock').innerText = data.current_stock;
            window.activePart = pNo;
        } else {
            alert("Part not found!");
            window.resetIssueTab();
        }
    };

    window.resetIssueTab = () => {
        document.getElementById('searchResult').style.display = "none";
        document.getElementById('searchPartNo').value = "";
        document.querySelectorAll('.issue-input').forEach(i => i.value = i.type=='number'?'1':'');
        window.activePart = null;
    };

    // --- 2. ISSUE ITEM (With MR No) ---
    window.issueItem = async () => {
        const mr = document.getElementById('issueMR').value.trim(); // NEW
        const emp = document.getElementById('issueEmp').value.trim();
        const mach = document.getElementById('issueMachine').value.trim();
        const dept = document.getElementById('issueDept').value.trim();
        const qty = parseInt(document.getElementById('issueQty').value);

        // Validation: MR No is now required
        if(!mr || !emp || !dept || isNaN(qty)) return alert("Please fill MR No, Emp, Dept and Qty");

        const ref = doc(db, "inventory", window.activePart);
        const snap = await getDoc(ref);
        
        if(snap.data().current_stock < qty) return alert("Not enough stock!");

        try {
            await updateDoc(ref, { current_stock: snap.data().current_stock - qty });
            
            await addDoc(collection(db, "transactions"), {
                part_number: window.activePart,
                mr_no: mr,          // Saved to database
                emp: emp,
                machine: mach,
                dept: dept,
                qty_issued: qty,
                date: Timestamp.now()
            });

            alert("Item Issued Successfully!");
            window.resetIssueTab();
        } catch (e) { alert("Error: " + e.message); }
    };

    // --- 3. ADD / RECEIVE ---
    window.receiveItem = async () => {
        const pNo = document.getElementById('newPartNo').value.trim().toUpperCase();
        const qty = parseInt(document.getElementById('newQty').value);
        if(!pNo) return;

        const ref = doc(db, "inventory", pNo);
        const snap = await getDoc(ref);

        if(snap.exists()) {
            await updateDoc(ref, { current_stock: snap.data().current_stock + qty });
        } else {
            await setDoc(ref, {
                part_number: pNo,
                model: document.getElementById('newModel').value,
                description: document.getElementById('newDesc').value,
                current_stock: qty
            });
        }
        alert("Stock Updated");
        document.getElementById('newPartNo').value = "";
    };

    // --- 4. EXCEL IMPORT ---
    window.importFromExcel = () => {
        const file = document.getElementById('excelFile').files[0];
        if(!file) return alert("Select File");
        const reader = new FileReader();
        reader.onload = async (e) => {
            const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
            const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            let count = 0;
            for(let r of data) {
                const p = String(r.PartNo||r.partno).trim().toUpperCase();
                const q = parseInt(r.Quantity||r.quantity||0);
                if(p) {
                    const ref = doc(db, "inventory", p);
                    const s = await getDoc(ref);
                    if(s.exists()) await updateDoc(ref, {current_stock: s.data().current_stock + q});
                    else await setDoc(ref, {part_number:p, model:r.Model||"", description:r.Description||"", current_stock:q});
                    count++;
                }
            }
            alert(`Imported ${count} items`);
        };
        reader.readAsArrayBuffer(file);
    };

    // --- 5. REPORTS (HISTORY vs CURRENT STOCK) ---
    
    // A. Transaction History Report
    window.loadTransactionReport = async () => {
        const s = document.getElementById('startDate').value;
        const e = document.getElementById('endDate').value;
        if(!s || !e) return alert("Select dates");

        const start = new Date(s); 
        const end = new Date(e); end.setHours(23,59,59);

        // Fetch Data
        const q = query(collection(db, "transactions"), where("date", ">=", start), where("date", "<=", end));
        const snap = await getDocs(q);

        // Update Headers
        const thead = document.querySelector("#reportTable thead");
        thead.innerHTML = `<tr>
            <th>Date</th><th>MR No</th><th>Part No</th><th>Emp</th><th>Machine</th><th>Dept</th><th>Qty Issued</th>
        </tr>`;

        // Update Body
        const tbody = document.querySelector("#reportTable tbody");
        tbody.innerHTML = "";
        document.getElementById('reportTitle').innerText = "Transaction History Report";

        snap.forEach(d => {
            const data = d.data();
            tbody.innerHTML += `<tr>
                <td>${data.date.toDate().toLocaleDateString()}</td>
                <td>${data.mr_no || '-'}</td>
                <td>${data.part_number}</td>
                <td>${data.emp}</td>
                <td>${data.machine}</td>
                <td>${data.dept}</td>
                <td>${data.qty_issued}</td>
            </tr>`;
        });
        if(snap.empty) tbody.innerHTML = "<tr><td colspan='7'>No records found</td></tr>";
    };

    // B. Current Stock Report
    window.loadCurrentStockReport = async () => {
        const snap = await getDocs(collection(db, "inventory"));

        // Update Headers
        const thead = document.querySelector("#reportTable thead");
        thead.innerHTML = `<tr>
            <th>Part No</th><th>Model</th><th>Description</th><th>Current Stock</th>
        </tr>`;

        // Update Body
        const tbody = document.querySelector("#reportTable tbody");
        tbody.innerHTML = "";
        document.getElementById('reportTitle').innerText = "Current Stock Report";

        snap.forEach(d => {
            const data = d.data();
            // Check for low stock (Less than 5)
            const stockClass = data.current_stock < 5 ? 'low-stock' : '';
            
            tbody.innerHTML += `<tr>
                <td>${data.part_number}</td>
                <td>${data.model}</td>
                <td>${data.description}</td>
                <td class="${stockClass}">${data.current_stock}</td>
            </tr>`;
        });
    };

    // Common Excel Export (Works for both table views)
    window.exportToExcel = () => {
        const table = document.getElementById("reportTable");
        const title = document.getElementById('reportTitle').innerText;
        XLSX.writeFile(XLSX.utils.table_to_book(table), title + ".xlsx");
    };

    window.switchTab = (id, e) => {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        e.currentTarget.classList.add('active');
    };
</script>
</body>
</html>
