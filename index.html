<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Inventory System</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 950px; margin: 20px auto; background: #f0f2f5; padding: 15px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        
        /* Input Styling */
        input { padding: 12px; margin: 5px 0 15px 0; width: 100%; box-sizing: border-box; border: 2px solid #bdc1c6; border-radius: 6px; font-size: 15px; }
        input:focus { border-color: #1a73e8; outline: none; background: #f8fbff; }
        label { font-weight: bold; color: #444; font-size: 13px; }
        
        /* Tabs */
        .tabs { display: flex; margin-bottom: 25px; gap: 10px; border-bottom: 2px solid #ddd; }
        .tab { padding: 12px 20px; cursor: pointer; color: #5f6368; font-weight: 500; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .tab.active { color: #1a73e8; border-bottom: 3px solid #1a73e8; font-weight: bold; background: #e8f0fe; border-radius: 5px 5px 0 0; }
        
        /* Content & Buttons */
        .content-section { display: none; }
        .content-section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        button { background: #1a73e8; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button:hover { opacity: 0.9; }
        .btn-issue { background: #d93025; }
        .btn-excel { background: #188038; }
        .btn-clear { background: #e0e0e0; color: #333; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        
        /* Search Results List */
        .search-list { max-height: 200px; overflow-y: auto; border: 1px solid #ddd; margin-bottom: 15px; display: none; }
        .search-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; background: #fff; }
        .search-item:hover { background: #f1f3f4; }
        .search-item strong { color: #1a73e8; }

        .result-box { border: 2px solid #1a73e8; padding: 20px; background: #f8fbff; margin-top: 20px; border-radius: 8px; display: none; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { border: 1px solid #dadce0; padding: 10px; text-align: left; }
        th { background: #f1f3f4; color: #333; }
        .low-stock { color: #d93025; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color:#1a73e8;">Advanced Inventory System</h2>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('issue-tab', event)"><span class="material-icons">search</span> FIND & ISSUE</div>
        <div class="tab" onclick="switchTab('receive-tab', event)"><span class="material-icons">add_box</span> ADD ITEM</div>
        <div class="tab" onclick="switchTab('report-tab', event)"><span class="material-icons">analytics</span> REPORTS</div>
    </div>

    <div id="issue-tab" class="content-section active">
        <label>Search by Part Name OR Number:</label>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="searchInput" placeholder="Type 'Hook', '9000', or Part No..." onkeyup="liveSearch()">
            <button style="width: 50px;" onclick="liveSearch()"><span class="material-icons">refresh</span></button>
        </div>

        <div id="matchesList" class="search-list"></div>

        <div id="selectedItemBox" class="result-box">
            <div class="grid-2">
                <div>
                    <small>Selected Item:</small><br>
                    <strong id="resDesc" style="font-size:1.2em;"></strong><br>
                    <span id="resModel" style="color:#666;"></span>
                </div>
                <div style="text-align:right;">
                    <small>Stock Available</small><br>
                    <span id="resStock" style="font-size:28px; color:green; font-weight:bold;"></span>
                </div>
            </div>
            <hr style="border:0; border-top:1px solid #cce0ff; margin: 15px 0;">
            
            <div class="grid-3">
                <div><label>MR No:</label><input type="text" id="issueMR" class="issue-input"></div>
                <div><label>Emp No:</label><input type="text" id="issueEmp" class="issue-input"></div>
                <div><label>Machine:</label><input type="text" id="issueMachine" class="issue-input"></div>
            </div>
            <div class="grid-2">
                <div><label>Dept:</label><input type="text" id="issueDept" class="issue-input"></div>
                <div><label>Qty:</label><input type="number" id="issueQty" class="issue-input" value="1"></div>
            </div>
            
            <button class="btn-issue" onclick="issueItem()"><span class="material-icons">outbound</span> CONFIRM ISSUE</button>
            <button class="btn-clear" onclick="resetSearch()">CANCEL</button>
        </div>
    </div>

    <div id="receive-tab" class="content-section">
        <h3>Add New Item</h3>
        <label>Part Number (Leave empty to auto-generate):</label>
        <input type="text" id="newPartNo" placeholder="e.g. 228-96500">
        
        <div class="grid-2">
            <div><label>Model:</label><input type="text" id="newModel"></div>
            <div><label>Description:</label><input type="text" id="newDesc" placeholder="e.g. Rotary Hook"></div>
        </div>
        <label>Quantity:</label><input type="number" id="newQty" value="1">
        <button onclick="receiveItem()"><span class="material-icons">save</span> SAVE STOCK</button>
        
        <hr>
        <div style="background:#fafafa; padding:15px; border-radius:8px; text-align:center;">
            <small>Bulk Upload (Excel)</small><br>
            <input type="file" id="excelFile" accept=".xlsx, .xls">
            <button class="btn-excel" onclick="importFromExcel()" style="margin-top:5px;">UPLOAD EXCEL</button>
        </div>
    </div>

    <div id="report-tab" class="content-section">
        <div class="grid-2">
            <div>
                <button class="btn-clear" onclick="loadTransactionReport()"><span class="material-icons">history</span> HISTORY LOG</button>
                <div class="grid-2" style="margin-top:5px;">
                    <input type="date" id="startDate"> <input type="date" id="endDate">
                </div>
            </div>
            <div>
                <button class="btn-excel" onclick="loadCurrentStockReport()"><span class="material-icons">inventory</span> CURRENT STOCK</button>
            </div>
        </div>
        <button onclick="exportToExcel()" style="margin-top:10px;">DOWNLOAD EXCEL</button>
        <h4 id="reportTitle">Report Output</h4>
        <div style="overflow-x:auto;">
            <table id="reportTable"><thead></thead><tbody></tbody></table>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, addDoc, getDocs, query, where, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // --- PASTE FIREBASE CONFIG HERE ---
   const firebaseConfig = {
apiKey: "AIzaSyDD-j_7VC20v4mNFmfdpEGk0yIErDF8Pv8",
authDomain: "inventory-system-5356c.firebaseapp.com",
projectId: "inventory-system-5356c",
storageBucket: "inventory-system-5356c.firebasestorage.app",
messagingSenderId: "691647241868",
appId: "1:691647241868:web:3ac4c43e1a7d11b71ba5a9",
measurementId: "G-D4VWJD23ND"
};


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // GLOBAL VARIABLES
    let inventoryCache = []; // Stores data locally for fast search
    let activeDocId = null;  // Stores ID of currently selected item

    // --- 1. SMART SEARCH SYSTEM ---
    
    // Load data on startup
    window.onload = async () => { await refreshInventoryCache(); };

    async function refreshInventoryCache() {
        // Fetches all items once so search is instant
        const snap = await getDocs(collection(db, "inventory"));
        inventoryCache = [];
        snap.forEach(d => {
            inventoryCache.push({ id: d.id, ...d.data() });
        });
        console.log("Inventory Loaded: " + inventoryCache.length + " items");
    }

    window.liveSearch = () => {
        const text = document.getElementById('searchInput').value.trim().toUpperCase();
        const listDiv = document.getElementById('matchesList');
        listDiv.innerHTML = "";
        
        if(text.length < 2) { 
            listDiv.style.display = "none"; return; 
        }

        // Filter: Check Part No OR Description (Partial Match)
        const matches = inventoryCache.filter(item => {
            const pNo = (item.part_number || "").toUpperCase();
            const desc = (item.description || "").toUpperCase();
            const model = (item.model || "").toUpperCase();
            return pNo.includes(text) || desc.includes(text) || model.includes(text);
        });

        if(matches.length === 0) {
            listDiv.style.display = "block";
            listDiv.innerHTML = "<div class='search-item'>No items found</div>";
        } else {
            listDiv.style.display = "block";
            matches.forEach(item => {
                const div = document.createElement('div');
                div.className = 'search-item';
                div.innerHTML = `<strong>${item.part_number || "No Part #"}</strong> - ${item.description} <br><small>${item.model || ""}</small>`;
                div.onclick = () => selectItem(item);
                listDiv.appendChild(div);
            });
        }
    };

    window.selectItem = (item) => {
        activeDocId = item.id; // Store the system ID
        document.getElementById('matchesList').style.display = "none";
        document.getElementById('selectedItemBox').style.display = "block";
        
        document.getElementById('resDesc').innerText = item.description;
        document.getElementById('resModel').innerText = item.model;
        document.getElementById('resStock').innerText = item.current_stock;
        
        // Populate inputs if needed or clear them
        document.getElementById('searchInput').value = item.part_number || item.description;
    };

    window.resetSearch = () => {
        document.getElementById('matchesList').style.display = "none";
        document.getElementById('selectedItemBox').style.display = "none";
        document.getElementById('searchInput').value = "";
        activeDocId = null;
        document.querySelectorAll('.issue-input').forEach(i => i.value = i.type=='number'?'1':'');
    };

    // --- 2. RECEIVE (Updated for No Part Number) ---
    window.receiveItem = async () => {
        let pNo = document.getElementById('newPartNo').value.trim().toUpperCase();
        const qty = parseInt(document.getElementById('newQty').value);
        const model = document.getElementById('newModel').value.trim();
        const desc = document.getElementById('newDesc').value.trim();

        if(!desc || isNaN(qty)) return alert("Description and Quantity are required!");

        // If no Part No, generate a unique ID
        let docId = pNo;
        if(!pNo) {
            docId = "AUTO-" + Date.now(); // Generate ID like AUTO-170494832
            pNo = ""; // Save as empty string in field
            alert("No Part Number provided. Generated ID: " + docId);
        }

        try {
            const ref = doc(db, "inventory", docId);
            const snap = await getDoc(ref);

            if(snap.exists()) {
                await updateDoc(ref, { current_stock: snap.data().current_stock + qty });
            } else {
                await setDoc(ref, {
                    part_number: pNo,
                    model: model,
                    description: desc,
                    current_stock: qty
                });
            }
            alert("Saved Successfully!");
            refreshInventoryCache(); // Update local list
            
            // Clear inputs
            document.getElementById('newPartNo').value = "";
            document.getElementById('newDesc').value = "";
        } catch(e) { alert("Error: " + e.message); }
    };

    // --- 3. ISSUE ITEM ---
    window.issueItem = async () => {
        if(!activeDocId) return alert("Please select an item first");
        
        const qty = parseInt(document.getElementById('issueQty').value);
        const ref = doc(db, "inventory", activeDocId);
        const snap = await getDoc(ref);

        if(snap.data().current_stock < qty) return alert("Low Stock!");

        await updateDoc(ref, { current_stock: snap.data().current_stock - qty });
        
        await addDoc(collection(db, "transactions"), {
            item_id: activeDocId,
            part_number: snap.data().part_number || "N/A",
            description: snap.data().description,
            mr_no: document.getElementById('issueMR').value,
            emp: document.getElementById('issueEmp').value,
            machine: document.getElementById('issueMachine').value,
            dept: document.getElementById('issueDept').value,
            qty_issued: qty,
            date: Timestamp.now()
        });

        alert("Issued!");
        // Update local cache manually to reflect stock change immediately
        const cachedItem = inventoryCache.find(i => i.id === activeDocId);
        if(cachedItem) cachedItem.current_stock -= qty;
        
        resetSearch();
    };

    // --- 4. REPORTS ---
    window.loadCurrentStockReport = async () => {
        document.getElementById('reportTitle').innerText = "Current Stock Report";
        const tbody = document.querySelector("#reportTable tbody");
        document.querySelector("#reportTable thead").innerHTML = "<tr><th>Part No</th><th>Desc</th><th>Model</th><th>Stock</th></tr>";
        tbody.innerHTML = "";
        
        // Use cache for speed
        inventoryCache.forEach(data => {
            const stockClass = data.current_stock < 5 ? 'low-stock' : '';
            tbody.innerHTML += `<tr>
                <td>${data.part_number || 'N/A'}</td>
                <td>${data.description}</td>
                <td>${data.model}</td>
                <td class="${stockClass}">${data.current_stock}</td>
            </tr>`;
        });
    };

    window.loadTransactionReport = async () => {
        const s = document.getElementById('startDate').value;
        const e = document.getElementById('endDate').value;
        if(!s || !e) return alert("Select Dates");
        
        const start = new Date(s);
        const end = new Date(e); end.setHours(23,59,59);
        
        const q = query(collection(db, "transactions"), where("date", ">=", start), where("date", "<=", end));
        const snap = await getDocs(q);
        
        document.getElementById('reportTitle').innerText = "History Report";
        const tbody = document.querySelector("#reportTable tbody");
        document.querySelector("#reportTable thead").innerHTML = "<tr><th>Date</th><th>MR</th><th>Part No</th><th>Desc</th><th>Dept</th><th>Qty</th></tr>";
        tbody.innerHTML = "";

        snap.forEach(d => {
            const data = d.data();
            tbody.innerHTML += `<tr>
                <td>${data.date.toDate().toLocaleDateString()}</td>
                <td>${data.mr_no || '-'}</td>
                <td>${data.part_number}</td>
                <td>${data.description}</td>
                <td>${data.dept}</td>
                <td>${data.qty_issued}</td>
            </tr>`;
        });
    };

    window.exportToExcel = () => {
        XLSX.writeFile(XLSX.utils.table_to_book(document.getElementById("reportTable")), "Inventory_Report.xlsx");
    };

    // EXCEL IMPORT
    window.importFromExcel = () => {
        const file = document.getElementById('excelFile').files[0];
        if(!file) return alert("Select File");
        const reader = new FileReader();
        reader.onload = async (e) => {
            const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
            const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            for(let r of data) {
                // If PartNo is empty, use description as ID or generate one? 
                // For simplicity, we skip items with no PartNo in import, or handle strictly
                let p = String(r.PartNo||r.partno||"").trim().toUpperCase();
                let desc = r.Description || r.description || "Imported Item";
                let qty = parseInt(r.Quantity||r.quantity||0);
                
                if(p) {
                    const ref = doc(db, "inventory", p);
                    const s = await getDoc(ref);
                    if(s.exists()) await updateDoc(ref, {current_stock: s.data().current_stock + qty});
                    else await setDoc(ref, {part_number:p, model:r.Model||"", description:desc, current_stock:qty});
                }
            }
            alert("Import Complete");
            refreshInventoryCache();
        };
        reader.readAsArrayBuffer(file);
    };

    window.switchTab = (id, e) => {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        e.currentTarget.classList.add('active');
    };
</script>
</body>
</html>
